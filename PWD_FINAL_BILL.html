<!-- ═════════ DOCUMENT (paper) CSS — also copied into the print window ═════════ -->
<style id="docCss">
@page{size:A4 portrait;margin:11mm}
@page land{size:A4 landscape;margin:10mm}
.page{background:#fff;color:#000;font-family:"Times New Roman","Noto Sans Devanagari","Mangal",serif;font-size:13px;line-height:1.45;width:210mm;min-height:277mm;padding:12mm 13mm;margin:0 auto 14px;box-shadow:0 1px 8px rgba(0,0,0,.25);box-sizing:border-box;position:relative}
.page.land{width:297mm;min-height:190mm;page:land}
.mr{font-family:"Noto Sans Devanagari","Mangal","Nirmala UI",sans-serif}
.page h1,.page h2,.page h3{margin:0;font-weight:700}
.tc{text-align:center}.tr{text-align:right}.b{font-weight:700}
.ind{display:inline-block;margin-left:34px}
.rule{border:0;border-top:2.5px double #222;margin:6px 0}
.blank{display:inline-block;min-width:70px;border-bottom:1px dotted #000;height:1em;vertical-align:bottom}
.ce{outline:none}
.edit .ce{display:inline-block;min-width:34px;background:rgba(255,235,59,.18);border-bottom:1px dashed #b59b00;padding:0 2px}
.edit .ce:focus{background:rgba(255,235,59,.45)}
.edit input.ni{width:74px;text-align:right;border:1px solid #c8a200;background:#fffbe0;font:inherit;font-size:12px;padding:1px 3px}
.edit input.nw{width:100%;box-sizing:border-box;border:1px solid #c8a200;background:#fffbe0;font:inherit;font-size:12px;padding:1px 3px}
.edit select.ni{width:auto}
.noprint{display:none}
.edit .noprint{display:block}
.mini{font-size:11px;cursor:pointer;border:1px solid #888;background:#eee;border-radius:3px;padding:1px 7px}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{border:1px solid #000;padding:3px 5px;vertical-align:middle}
table.t th{font-weight:700;text-align:center}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td.c{text-align:center}
table.t tr{page-break-inside:avoid}
.tot td{font-weight:700}
.sigr{margin-top:26px;text-align:right;font-weight:700}
/* checklist */
table.ck td,table.ck th{font-size:12.5px}
table.ck td.q{width:49%;vertical-align:top}
table.ck td.r{width:17%;vertical-align:top;height:40px;text-align:center}
table.ck td.r .ce{display:block}
table.ck td.sub{padding-left:22px}
.pb{page-break-before:always}
.kv{display:flex;gap:6px;margin:5px 0}
.kv .k{flex:0 0 38%}
.kv .s{flex:0 0 14px}
.kv .v{flex:1;font-weight:700}
.issues .ln{height:23px;border-bottom:1px dotted #777;display:flex;gap:8px}
.issues .ln .ce{flex:1}
@media print{
  .page{box-shadow:none;margin:0;width:auto;min-height:0;padding:0}
  .page.land{width:auto;min-height:0}
  .page+.page{page-break-before:always}
  .noprint,.edit .noprint{display:none!important}
  body{background:#fff}
}
</style>

<!-- ═════════ APP (screen) CSS ═════════ -->
<style>
:root{--navy:#1a2744;--navy2:#26365f;--gold:#c8922a;--green:#1e6b3e;--red:#b3261e;--bg:#eef0f4;--card:#fff;--bd:#d7dbe3;--tx:#1d2433;--tx3:#6b7385}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
header.top{background:var(--navy);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
header.top .brand{font-weight:800;font-size:15px;margin-right:auto}
header.top .brand small{display:block;font-weight:400;font-size:10px;opacity:.75}
.btn{background:var(--gold);color:#fff;border:0;border-radius:6px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn.g{background:var(--green)}.btn.n{background:#3b4a78}.btn.r{background:var(--red)}.btn.l{background:#e4e7ee;color:var(--tx)}
.btn.sm{padding:4px 8px;font-size:11px}
nav#tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd);padding:6px 8px;position:sticky;top:48px;z-index:40}
nav#tabs button{border:1px solid var(--bd);background:#f6f7fa;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;font-family:inherit;color:var(--tx)}
nav#tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
main#view{padding:12px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--navy)}
.note{font-size:11.5px;color:var(--tx3);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--tx3);margin-bottom:2px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--bd);border-radius:6px;padding:7px 8px;font-size:13px;font-family:inherit;background:#fff}
.fld textarea{min-height:64px;resize:vertical}
.fld.full{grid-column:1/-1}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:var(--navy);color:#fff;padding:6px 5px;font-size:11px;text-align:left;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--bd);padding:3px 4px;vertical-align:top}
.tbl input,.tbl textarea,.tbl select{width:100%;border:1px solid var(--bd);border-radius:4px;padding:4px 5px;font-size:12px;font-family:inherit;background:#fff}
.tbl textarea{min-height:34px;resize:vertical}
.tbl td.ro{text-align:right;font-family:ui-monospace,Consolas,monospace;white-space:nowrap;padding-top:8px}
.scroll{overflow-x:auto}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.sum div{background:#f4f6fb;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font-size:12px}
.sum b{display:block;font-size:16px;color:var(--navy)}
.docbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.paperwrap{overflow:auto;padding-bottom:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:999;display:none;max-width:90vw}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
.modal-ov.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:520px;max-height:88vh;overflow:auto}
.modal h3{margin:0 0 10px;color:var(--navy)}
.est{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.est.sel{border-color:var(--green);background:#eaf6ee}
.est b{display:block}.est span{font-size:11px;color:var(--tx3)}
.warn{background:#fff7e0;border:1px solid #f0d27a;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px}
@media(max-width:640px){header.top .brand small{display:none}nav#tabs{top:92px}}
</style>
</head>

</div></div>

    <button class="btn l" onclick="closeModal('loginModal')">रद्द</button>
    <button class="btn g" onclick="loginEmail()">Login</button>
  </div>
</div></div>

function num(x){var v=parseFloat(x);return isNaN(v)?0:v;}
function amt(q,r){return Math.round(num(q)*num(r)+1e-9);}          // whole-rupee rounding (as in PWD bills)
function n2(x){return (Math.round(num(x)*100)/100).toFixed(2);}
function n3(x){return num(x).toFixed(3);}
function inr(x){return new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(num(x));}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shortDesc(d){d=String(d||'').replace(/^\s*Item\s*No\.?\s*[\d.]+\s*[:\-–]*\s*/i,'');var p=d.split(/\s+etc\b/i)[0];p=p.replace(/[\s,;:\-]+$/,'');return p.length>70?p.substring(0,70)+'…':p;}

/* ═══════════════════════════════════════════════════════════
   CALCULATIONS
   ═══════════════════════════════════════════════════════════ */
function validItem(it){return num(it.qty)>0||num(it.estQty)>0;}

/* Royalty — per item, per material, from CF × executed qty (tender side uses estimate qty) */
function royCalc(){
  var rows=[];
  if(S.roy.on){
    S.items.forEach(function(it){
      if(!validItem(it))return;
      var cf=itemCF(it);if(!cf)return;
      var q=num(it.qty),tq=num(it.estQty);
      var mats=Object.keys(cf).filter(function(k){return SAND_KEYS.indexOf(k)>=0||MURUM_KEYS.indexOf(k)>=0;});
      mats.forEach(function(k){
        var g=SAND_KEYS.indexOf(k)>=0?'sand':'other';
        var key=it.id+'|'+k,ov=S.roy.ov[key]||{};
        var c=(ov.cf!==undefined&&ov.cf!=='')?num(ov.cf):num(cf[k]);
        var rate=(ov.rate!==undefined&&ov.rate!=='')?num(ov.rate):(g==='sand'?num(S.roy.rateSand):num(S.roy.rateMurum));
        rows.push({key:key,g:g,desc:shortDesc(it.desc),mat:MAT_LABEL[k]||k,multi:mats.length>1,q:q,tq:tq,cf:c,rate:rate,net:q*c,tnet:tq*c,amt:amt(q*c,rate),tamt:amt(tq*c,rate)});
      });
    });
    S.roy.extra.forEach(function(x){
      var q=num(x.qty),c=(x.cf===''||x.cf===undefined)?1:num(x.cf),r=num(x.rate),g=x.g==='sand'?'sand':'other';
      rows.push({key:'x|'+x.id,extra:true,id:x.id,g:g,desc:x.desc||'',mat:'',q:q,tq:q,cf:c,rate:r,net:q*c,tnet:q*c,amt:amt(q*c,r),tamt:amt(q*c,r)});
    });
  }
  var G={sand:{q:0,tq:0,amt:0,tamt:0,rates:{}},other:{q:0,tq:0,amt:0,tamt:0,rates:{}}};
  rows.forEach(function(r){var g=G[r.g];g.q+=r.net;g.tq+=r.tnet;g.amt+=r.amt;g.tamt+=r.tamt;g.rates[r.rate]=1;});
  ['sand','other'].forEach(function(k){var g=G[k],ks=Object.keys(g.rates);
    g.rate=ks.length===1?num(ks[0]):(g.q>0?g.amt/g.q:(g.tq>0?g.tamt/g.tq:0));});
  return{rows:rows,G:G};
}

/* Whole bill: Total A (work items) + Total B (royalty + V&QC + extra) */
function billCalc(){
  var rows=[],seq=0,tA=0,tAt=0,tB=0,tBt=0,exc=0,les=0;
  function diff(a,t){var d=a-t;if(d>0)exc+=d;else if(d<0)les+=-d;}
  S.items.forEach(function(it){
    if(!validItem(it))return;seq++;
    var q=num(it.qty),tq=num(it.estQty),r=num(it.rate),a=amt(q,r),ta=amt(tq,r);
    tA+=a;tAt+=ta;diff(a,ta);
    rows.push({sec:'A',kind:'item',key:it.id,no:seq,desc:it.desc,unit:it.unit,q:q,tq:tq,r:r,amt:a,tamt:ta});
  });
  var roy=royCalc();
  ['other','sand'].forEach(function(g){
    var G=roy.G[g];if(!(G.q>0||G.tq>0))return;seq++;
    tB+=G.amt;tBt+=G.tamt;diff(G.amt,G.tamt);
    rows.push({sec:'B',kind:'roy',key:'roy_'+g,no:seq,desc:'Royalty charges'+(g==='sand'?' (sand)':'')+' etc. complete',unit:'Cum',q:G.q,tq:G.tq,r:G.rate,amt:G.amt,tamt:G.tamt});
  });
  var tests=S.tests.filter(function(t){return t.desc&&(num(t.qty)>0||num(t.tq)>0);});
  if(tests.length){
    seq++;rows.push({sec:'B',kind:'vqc',key:'vqc',no:seq,desc:'V&QC charges etc. complete'});
    tests.forEach(function(t){
      var q=num(t.qty),tq=(t.tq===''||t.tq===undefined)?q:num(t.tq),r=num(t.rate),a=amt(q,r),ta=amt(tq,r);
      tB+=a;tBt+=ta;diff(a,ta);
      rows.push({sec:'B',kind:'test',key:'t_'+t.id,desc:t.desc,unit:t.unit||'Test',q:q,tq:tq,r:r,amt:a,tamt:ta});
    });
  }
  S.extraB.forEach(function(x){
    if(!x.desc||!(num(x.qty)>0||num(x.tq)>0))return;seq++;
    var q=num(x.qty),tq=(x.tq===''||x.tq===undefined)?q:num(x.tq),r=num(x.rate),a=amt(q,r),ta=amt(tq,r);
    tB+=a;tBt+=ta;diff(a,ta);
    rows.push({sec:'B',kind:'xb',key:'xb_'+x.id,no:seq,desc:x.desc,unit:x.unit,q:q,tq:tq,r:r,amt:a,tamt:ta});
  });
  return{rows:rows,tA:tA,tAt:tAt,tB:tB,tBt:tBt,total:tA+tB,ttotal:tAt+tBt,excess:exc,less:les};
}

/* Cement statement: theoretical = qty × CF(bags); actual defaults to nearest whole bag (editable) */
function cemCalc(){
  var rows=[],tt=0,ta=0;
  S.items.forEach(function(it){
    if(!validItem(it))return;var cf=itemCF(it);if(!cf||!cf.cement_bags)return;
    var q=num(it.qty);if(!(q>0))return;
    var c=(S.cem.cf[it.id]!==undefined&&S.cem.cf[it.id]!=='')?num(S.cem.cf[it.id]):num(cf.cement_bags);
    var th=Math.round(q*c*100)/100;
    var ac=(S.cem.act[it.id]!==undefined&&S.cem.act[it.id]!=='')?num(S.cem.act[it.id]):Math.round(th);
    rows.push({id:it.id,desc:it.desc,q:q,cf:c,th:th,ac:ac});tt+=th;ta+=ac;
  });
  S.cem.extra.forEach(function(x){
    var q=num(x.qty),c=num(x.cf),th=Math.round(q*c*100)/100;
    var ac=(x.act!==undefined&&x.act!=='')?num(x.act):Math.round(th);
    rows.push({id:x.id,extra:true,desc:x.desc,q:q,cf:c,th:th,ac:ac});tt+=th;ta+=ac;
  });
  return{rows:rows,tt:tt,ta:ta};
}

function dF46(E,forPrint){
  var cover=dF46cover(E),bill=dF46bill(E);
  if(!forPrint)return cover+bill;
  var n=Math.max(1,Math.min(5,parseInt(S.m.copies,10)||1)),out='';
  for(var i=0;i<n;i++)out+=cover+bill;
  return out;
}

var TAB='det';

function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none';},3200);}

function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button class="'+(t.id===TAB?'on':'')+'" onclick="go(\''+t.id+'\')">'+esc(t.label)+'</button>';}).join('');
}
function go(id){TAB=id;renderTabs();render();window.scrollTo(0,0);}
function render(){
  var v=document.getElementById('view');
  if(TAB==='det'){v.innerHTML=viewDetails();return;}
  if(TAB==='items'){v.innerHTML=viewItems();updTotals();return;}
  var d=DOCS.filter(function(x){return x.id===TAB;})[0];
  var bar='<div class="docbar"><button class="btn g" onclick="printDocs([\''+d.id+'\'])">🖨️ Print: '+esc(d.label)+'</button><button class="btn l" onclick="render()">🔄 Refresh</button><span class="note">पिवळ्या जागा थेट editable आहेत. Qty/Rate बदलायचे असल्यास "2 Items &amp; Qty" tab वापरा.</span></div>';
  v.innerHTML=bar+'<div class="paperwrap">'+d.fn(true)+'</div>';
}

/* ── Details ── */
function fld(label,path,opts){
  opts=opts||{};var m=S.m,val=m[path]==null?'':m[path];
  var inner=opts.area?'<textarea oninput="setM(\''+path+'\',this.value)" placeholder="'+esc(opts.ph||'')+'">'+esc(val)+'</textarea>'
    :'<input value="'+esc(val)+'" placeholder="'+esc(opts.ph||'')+'" oninput="setM(\''+path+'\',this.value)">';
  return '<div class="fld'+(opts.full?' full':'')+'"><label>'+label+'</label>'+inner+'</div>';
}
function setM(p,v){S.m[p]=v;persist();}
function viewDetails(){
  var h='<div class="warn">ℹ️ Division / Sub-Division चे नाव मुद्दाम <b>ABCD / XYZ</b> ठेवले आहे — तुमच्या कार्यालयाचे नाव आपोआप कुठेही येत नाही. हवे असल्यास खाली बदला.</div>';
  h+='<div class="card"><h3>कार्यालय</h3><div class="grid">'+fld('Division (EE office) — e.g. ABCD','division',{ph:'ABCD'})+fld('Sub-Division (SDE office) — e.g. XYZ','subdiv',{ph:'XYZ'})+fld('Sectional Engineer (Shri ...)','se',{ph:'नाव (MB record करणारे)'})+fld('लेखा शिर्ष (Account Head)','acHead')+'</div></div>';
  h+='<div class="card"><h3>काम व कंत्राटदार</h3><div class="grid">'+fld('Name of Work','workName',{area:1,full:1})+fld('Contractor / Agency','contractor')+fld('Agreement No. (e.g. B-1/80)','agrNo')+fld('Agreement Date (e.g. 25.6.2026)','agrDate')+fld('करारपत्राची विहित मुदत','period')+fld('काम पूर्ण दिनांक (Completion)','completionDate',{ph:'dd.mm.yyyy'})+'</div></div>';
  h+='<div class="card"><h3>रक्कम / MB</h3><div class="grid">'+fld('अंदाजित रक्कम (Lakhs) — Estimate मधून आपोआप','estLakhs',{ph:'e.g. 5.40'})+fld('निविदा रक्कम (Lakhs) — रिकामे = Tender qty×rate वरून आपोआप','tenderLakhs',{ph:'auto: '+lakhs(billCalc().ttotal)})+fld('M.B. No.','mbNo')+fld('M.B. Page No.','mbPage')+fld('Bill checked by SDE (%)','checkedPct')+fld('Letter Date','letterDate',{ph:'dd.mm.yyyy'})+'</div></div>';
  h+='<div class="card"><h3>Print पर्याय</h3><div class="grid"><div class="fld"><label>Form 46 (Cover + Bill) copies — Triplicate = 3</label><select onchange="setM(\'copies\',this.value)">'+[1,2,3,4,5].map(function(n){return '<option'+(+S.m.copies===n?' selected':'')+'>'+n+'</option>';}).join('')+'</select></div>'
    +fld('Forwarding letter — Doc. यादी (प्रत्येक ओळ = एक doc; {MB} = MB No.)','docLines',{area:1,full:1})+'</div></div>';
  h+='<div class="card"><button class="btn n" onclick="go(\'items\')">पुढे → Items &amp; Qty</button></div>';
  return h;
}

/* ── Items ── */
function viewItems(){
  var h='<div class="card"><h3>A) Work items (Total A)</h3><p class="note">Tender Qty = estimate मधील qty. Executed Qty = MB प्रमाणे प्रत्यक्ष qty — ती बदला, बाकी सर्व (Bill, Comparative, Cement, Royalty, Checklist) आपोआप बदलते. Amount = Qty × Rate (whole ₹ मध्ये round).</p>';
  h+='<div class="docbar"><button class="btn n sm" onclick="openEst()">📂 Estimate मधून items घ्या</button><button class="btn l sm" onclick="addItem()">＋ Item जोडा</button><button class="btn l sm" onclick="copyQty()">Executed = Tender (सर्व)</button></div>';
  h+='<div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>SSR No.</th><th style="min-width:230px">Description (Bill मध्ये दिसेल)</th><th>Unit</th><th>Rate</th><th>Tender Qty</th><th>Executed Qty</th><th>Tender ₹</th><th>Actual ₹</th><th></th></tr></thead><tbody>';
  if(!S.items.length)h+='<tr><td colspan="10" class="note" style="padding:14px">अजून items नाहीत — वर "Estimate मधून items घ्या" वापरा किंवा "Item जोडा".</td></tr>';
  S.items.forEach(function(it,i){
    h+='<tr><td>'+(i+1)+'</td><td style="min-width:62px"><input value="'+esc(it.no)+'" onchange="itSet('+i+',\'no\',this.value)"></td>'
     +'<td><textarea onchange="itSet('+i+',\'desc\',this.value)">'+esc(it.desc)+'</textarea></td>'
     +'<td style="min-width:56px"><input value="'+esc(it.unit)+'" onchange="itSet('+i+',\'unit\',this.value)"></td>'
     +'<td style="min-width:84px"><input inputmode="decimal" value="'+esc(it.rate)+'" oninput="itSet('+i+',\'rate\',this.value,1)"></td>'
     +'<td style="min-width:80px"><input inputmode="decimal" value="'+esc(it.estQty)+'" oninput="itSet('+i+',\'estQty\',this.value,1)"></td>'
     +'<td style="min-width:80px"><input inputmode="decimal" value="'+esc(it.qty)+'" oninput="itSet('+i+',\'qty\',this.value,1)"></td>'
     +'<td class="ro" id="ta'+i+'"></td><td class="ro" id="aa'+i+'"></td><td><button class="btn r sm" onclick="itDel('+i+')">✕</button></td></tr>';
  });
  h+='</tbody></table></div></div>';

  h+='<div class="card"><h3>B) Royalty</h3><div class="grid"><div class="fld"><label><input type="checkbox" style="width:auto" '+(S.roy.on?'checked':'')+' onchange="S.roy.on=this.checked;persist();updTotals()"> Royalty charges Bill मध्ये घ्या (CF × Executed qty)</label></div>'
    +'<div class="fld"><label>Royalty rate — other material (murum/metal/soling) ₹/Cum</label><input inputmode="decimal" value="'+esc(S.roy.rateMurum)+'" oninput="S.roy.rateMurum=this.value;persist();updTotals()"></div>'
    +'<div class="fld"><label>Royalty rate — sand ₹/Cum</label><input inputmode="decimal" value="'+esc(S.roy.rateSand)+'" oninput="S.roy.rateSand=this.value;persist();updTotals()"></div></div>'
    +'<p class="note">Royalty Statement tab मध्ये प्रत्येक row चा CF / rate वेगळा बदलता येतो. CF नसलेल्या item साठी तिथे manual row जोडा.</p></div>';

  h+='<div class="card"><h3>B) V&amp;QC / Testing charges</h3><div class="docbar"><button class="btn l sm" onclick="addTest()">＋ Test row</button><button class="btn l sm" onclick="addTest(\'C.C. cube\',\'Test\',725)">＋ C.C. cube (₹725)</button></div>';
  h+='<div class="scroll"><table class="tbl"><thead><tr><th>Test / Description</th><th>Unit</th><th>Tender Qty</th><th>Executed Qty</th><th>Rate</th><th>Amount</th><th></th></tr></thead><tbody>';
  if(!S.tests.length)h+='<tr><td colspan="7" class="note" style="padding:10px">Test charges नसल्यास रिकामे ठेवा.</td></tr>';
  S.tests.forEach(function(t,i){
    h+='<tr><td><input value="'+esc(t.desc)+'" onchange="tSet('+i+',\'desc\',this.value)"></td><td style="min-width:56px"><input value="'+esc(t.unit)+'" onchange="tSet('+i+',\'unit\',this.value)"></td>'
     +'<td style="min-width:70px"><input inputmode="decimal" value="'+esc(t.tq)+'" oninput="tSet('+i+',\'tq\',this.value,1)"></td><td style="min-width:70px"><input inputmode="decimal" value="'+esc(t.qty)+'" oninput="tSet('+i+',\'qty\',this.value,1)"></td>'
     +'<td style="min-width:80px"><input inputmode="decimal" value="'+esc(t.rate)+'" oninput="tSet('+i+',\'rate\',this.value,1)"></td><td class="ro" id="tt'+i+'"></td><td><button class="btn r sm" onclick="tDel('+i+')">✕</button></td></tr>';
  });
  h+='</tbody></table></div></div>';

  h+='<div class="card"><h3>B) इतर charges (optional)</h3><div class="docbar"><button class="btn l sm" onclick="addXB()">＋ Row जोडा</button></div><div class="scroll"><table class="tbl"><thead><tr><th>Description</th><th>Unit</th><th>Tender Qty</th><th>Executed Qty</th><th>Rate</th><th>Amount</th><th></th></tr></thead><tbody>';
  S.extraB.forEach(function(t,i){
    h+='<tr><td><input value="'+esc(t.desc)+'" onchange="xSet('+i+',\'desc\',this.value)"></td><td><input value="'+esc(t.unit)+'" onchange="xSet('+i+',\'unit\',this.value)"></td><td><input inputmode="decimal" value="'+esc(t.tq)+'" oninput="xSet('+i+',\'tq\',this.value,1)"></td><td><input inputmode="decimal" value="'+esc(t.qty)+'" oninput="xSet('+i+',\'qty\',this.value,1)"></td><td><input inputmode="decimal" value="'+esc(t.rate)+'" oninput="xSet('+i+',\'rate\',this.value,1)"></td><td class="ro" id="xt'+i+'"></td><td><button class="btn r sm" onclick="xDel('+i+')">✕</button></td></tr>';
  });
  h+='</tbody></table></div></div>';

  h+='<div class="sum" id="sumBox"></div>';
  return h;
}
/* live totals without re-rendering inputs (keeps cursor/keyboard) */
function updTotals(){
  S.items.forEach(function(it,i){var a=document.getElementById('aa'+i),t=document.getElementById('ta'+i);if(a)a.textContent=inr(amt(it.qty,it.rate));if(t)t.textContent=inr(amt(it.estQty,it.rate));});
  S.tests.forEach(function(t,i){var e=document.getElementById('tt'+i);if(e)e.textContent=inr(amt(t.qty,t.rate));});
  S.extraB.forEach(function(t,i){var e=document.getElementById('xt'+i);if(e)e.textContent=inr(amt(t.qty,t.rate));});
  var B=billCalc(),el=document.getElementById('sumBox');
  if(el)el.innerHTML='<div>Total A<b>₹ '+inr(B.tA)+'</b></div><div>Total B (Royalty+V&amp;QC)<b>₹ '+inr(B.tB)+'</b></div><div>Total A+B (Bill)<b>₹ '+inr(B.total)+'</b></div><div>Tender total<b>₹ '+inr(B.ttotal)+'</b></div><div>Excess<b style="color:var(--green)">₹ '+inr(B.excess)+'</b></div><div>Less<b style="color:var(--red)">₹ '+inr(B.less)+'</b></div>';
}
function itSet(i,f,v,live){S.items[i][f]=v;persist();if(live)updTotals();}
function itDel(i){if(!confirm('हा item काढायचा?'))return;S.items.splice(i,1);persist();render();}
function addItem(){S.items.push({id:uid(),no:'',desc:'',unit:'Cum',rate:'',estQty:'',qty:'',cf:null});persist();render();}
function copyQty(){S.items.forEach(function(it){it.qty=it.estQty;});S.tests.forEach(function(t){t.qty=t.tq;});persist();render();toast('Executed qty = Tender qty');}
function addTest(d,u,r){S.tests.push({id:uid(),desc:d||'',unit:u||'Test',tq:1,qty:1,rate:r||''});persist();render();}
function tSet(i,f,v,live){S.tests[i][f]=v;persist();if(live)updTotals();}
function tDel(i){S.tests.splice(i,1);persist();render();}
function addXB(){S.extraB.push({id:uid(),desc:'',unit:'',tq:1,qty:1,rate:''});persist();render();}
function xSet(i,f,v,live){S.extraB[i][f]=v;persist();if(live)updTotals();}
function xDel(i){S.extraB.splice(i,1);persist();render();}

/* ── Doc inline handlers (cement / royalty) ── */
function cemSet(id,k,v){var ex=S.cem.extra.filter(function(x){return x.id===id;})[0];
  if(ex){if(k==='cf')ex.cf=v;else ex.act=v;}else S.cem[k][id]=v;persist();render();}
function cemAdd(){S.cem.extra.push({id:uid(),desc:prompt('Item description?','')||'Item',qty:+prompt('Quantity?','0')||0,cf:+prompt('Cement bags per unit (CF)?','0')||0});persist();render();}
function cemDel(id){S.cem.extra=S.cem.extra.filter(function(x){return x.id!==id;});persist();render();}
function royOv(key,k,v){S.roy.ov[key]=S.roy.ov[key]||{};S.roy.ov[key][k]=v;persist();render();}
function royXAdd(g){S.roy.extra.push({id:uid(),g:g,desc:prompt('Description?','')||'Material',qty:+prompt('Quantity (Cum)?','0')||0,cf:1,rate:g==='sand'?S.roy.rateSand:S.roy.rateMurum});persist();render();}
function royXSet(id,k,v){var x=S.roy.extra.filter(function(e){return e.id===id;})[0];if(x)x[k]=v;persist();render();}
function royXDel(id){S.roy.extra=S.roy.extra.filter(function(x){return x.id!==id;});persist();render();}

/* contenteditable → state */
document.addEventListener('input',function(e){var t=e.target;
  if(t&&t.classList&&t.classList.contains('ce')){S.txt[t.getAttribute('data-k')]=t.innerText.replace(/\n$/,'');persist();}});

/* ═══════════════════════════════════════════════════════════
   LOAD FROM ESTIMATE (Firebase 'estimates' collection)
   Pulls: items (no, desc, unit, rate, qty, cf), work name, contractor, grand total.
   Does NOT pull division / sub-division → ABCD / XYZ stay.
   ═══════════════════════════════════════════════════════════ */
var SEL_EST=null;
function openEst(){
  if(!DB){toast('Firebase उपलब्ध नाही — items manually भरा');return;}
  if(!CU){openLogin();return;}
  SEL_EST=null;document.getElementById('btnLoadEst').disabled=true;
  document.getElementById('estList').innerHTML='<p class="note">Loading…</p>';openModal('estModal');
  DB.collection('estimates').where('uid','==',CU.uid).orderBy('updatedAt','desc').limit(50).get().then(function(snap){
    if(snap.empty){document.getElementById('estList').innerHTML='<p class="note">Saved estimates नाहीत. Estimator मध्ये estimate save करा.</p>';return;}
    var h='';snap.forEach(function(doc){var d=doc.data(),n=(d.items||[]).length,dt=d.updatedAt&&d.updatedAt.toDate?d.updatedAt.toDate().toLocaleDateString('en-IN'):'—';
      h+='<div class="est" id="e_'+doc.id+'" onclick="selEst(\''+doc.id+'\')"><b>'+esc(d.name||'Untitled Estimate')+'</b><span>'+dt+' | '+n+' items'+(d.grand?' | ₹'+inr(d.grand):'')+'</span></div>';});
    document.getElementById('estList').innerHTML=h;
  }).catch(function(e){document.getElementById('estList').innerHTML='<p class="note" style="color:var(--red)">'+esc(e.message)+'</p>';});
}
function selEst(id){SEL_EST=id;document.querySelectorAll('.est').forEach(function(x){x.classList.remove('sel');});var el=document.getElementById('e_'+id);if(el)el.classList.add('sel');document.getElementById('btnLoadEst').disabled=false;}
function loadEst(){
  if(!SEL_EST)return;
  DB.collection('estimates').doc(SEL_EST).get().then(function(doc){
    if(!doc.exists){toast('Estimate सापडला नाही');return;}
    var d=doc.data(),src=d.items||[];if(!src.length){toast('Items नाहीत');return;}
    if(S.items.length&&!confirm('सध्याचे items बदलले जातील. चालेल?'))return;
    var meta=d.cover||d.meta||{};
    S.items=[];
    src.forEach(function(it,i){
      var rate=parseFloat(it.finalRate)||parseFloat(it.baseRate)||parseFloat(it.rate)||parseFloat(it.rateAmt)||parseFloat(it.ssrRate)||parseFloat(it.unitRate)||parseFloat(it.basicRate)||0;
      var q=parseFloat(it.qty)||parseFloat(it.estQty)||0;
      S.items.push({id:uid(),no:String(it.no||'').trim(),desc:it.desc||it.description||'',unit:it.unit||'',rate:rate,estQty:q,qty:q,cf:(it.cf&&typeof it.cf==='object')?it.cf:null});
    });
    if(meta.pName&&!S.m.workName)S.m.workName=meta.pName;
    if(meta.contractor&&!S.m.contractor)S.m.contractor=meta.contractor;
    if(d.grand)S.m.estLakhs=lakhs(d.grand);
    // forwarding-letter doc list: add Steel / Asphalt lines only if estimate really uses them
    var hasSteel=S.items.some(function(x){var c=itemCF(x);return c&&c.ms_bars;}),hasBit=S.items.some(function(x){var c=itemCF(x);return c&&c.bitumen;});
    var L=DOC_LINES_DEFAULT.split('\n');
    if(hasBit)L.splice(4,0,'Asphalt Cons.');if(hasSteel)L.splice(4,0,'Steel statement');
    S.m.docLines=L.join('\n');
    S.tests=S.tests||[];S.roy.ov={};S.cem.cf={};S.cem.act={};
    persist();closeModal('estModal');go('items');
    var noRate=S.items.filter(function(x){return !num(x.rate);}).length;
    toast('✅ '+S.items.length+' items load झाले'+(noRate?(' — ⚠️ '+noRate+' items ला rate नाही'):''));
  }).catch(function(e){toast('Load error: '+e.message);});
}

/* ═══════════════════════════════════════════════════════════
   PRINT
   ═══════════════════════════════════════════════════════════ */
function printDocs(ids){
  var html='';
  ids.forEach(function(id){var d=DOCS.filter(function(x){return x.id===id;})[0];html+=(id==='f46')?dF46(false,true):d.fn(false);});
  var w=window.open('','_blank');
  if(!w){toast('Popup block झाला — browser मध्ये popup allow करा');return;}
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>1st &amp; Final Bill</title>'
    +'<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">'
    +'<style>'+document.getElementById('docCss').textContent+'body{margin:0;background:#fff}</style></head><body>'+html
    +'<div class="noprint" style="display:block!important"></div>'
    +'<script>window.onload=function(){setTimeout(function(){window.print();},700);};<\/script></body></html>');
  w.document.close();
}
function printAll(){
  if(!S.items.length&&!confirm('Items अजून भरलेले नाहीत. तरीही print करायचे?'))return;
  printDocs(DOCS.map(function(d){return d.id;}));
}

/* ═══════════════════════════════════════════════════════════
   SAVE / OPEN / NEW (file based, plus automatic local autosave)
   ═══════════════════════════════════════════════════════════ */
function saveFile(){
  var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='final_bill_'+(S.m.agrNo||'draft').replace(/[^\w\-]+/g,'_')+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  toast('💾 File save झाली (autosave सुद्धा चालू आहे)');
}
function openFile(inp){
  var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{S=mergeDefaults(JSON.parse(r.result));persist();go('det');toast('📥 File open झाली');}catch(e){toast('File वाचता आली नाही');}};
  r.readAsText(f);inp.value='';
}
function newBill(){if(!confirm('नवीन bill सुरू करायचे? सध्याचा data पुसला जाईल (आधी Save करा).'))return;S=newState();persist();go('det');}

/* boot */
renderTabs();render();userChip();
</script>
